[package]
name = "cliplocal"
version = "0.1.0"
description = "ClipLocal - self-hosted game clip recorder"
authors = ["ClipLocal"]
license = ""
repository = ""
edition = "2021"

[lib]
name = "cliplocal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cliplocal"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
